name: Build XboxCDTest XEX

# Roda automaticamente em cada push, e também pode ser disparado manualmente
# na aba "Actions" do GitHub (botão "Run workflow").
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Instalar dependências de build do host
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison gcc-multilib libgmp3-dev libmpfr-dev \
            libmpc-dev texinfo git-core build-essential wget file pv cmake \
            libgmp-dev nettle-dev

      # O build do binutils+gcc+newlib demora bastante (pode passar de 1h).
      # Cacheamos o resultado para não repetir isso a cada push.
      - name: Cache do toolchain Xenon
        id: cache-xenon
        uses: actions/cache@v4
        with:
          path: /usr/local/xenon
          key: xenon-toolchain-v3

      - name: Clonar libxenon (Free60Project)
        run: git clone --depth 1 https://github.com/Free60Project/libxenon.git

      - name: Construir toolchain Xenon (binutils + gcc + newlib)
        if: steps.cache-xenon.outputs.cache-hit != 'true'
        working-directory: libxenon/toolchain
        run: |
          export PREFIX=/usr/local/xenon
          ./build-xenon-toolchain toolchain

      - name: Construir e instalar libxenon (com força bruta)
        working-directory: libxenon/toolchain
        run: |
          export PREFIX=/usr/local/xenon
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
    
          # Verifica se o GCC está configurado corretamente
          echo "=== Testando xenon-gcc ==="
          xenon-gcc -dumpmachine
          xenon-gcc -dumpspecs | grep -i "m32\|mcpu\|cell" || true
    
          echo "=== Compilando libxenon ==="
          cd ../lib
          make -f Makefile.xenon clean
          make -f Makefile.xenon CC=xenon-gcc CXX=xenon-g++ AR=xenon-ar RANLIB=xenon-ranlib
          sudo make -f Makefile.xenon install
          
      - name: Verificar toolchain (não aceitar apenas "existir")
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          which xenon-gcc
          which xenon-g++
          which xenon-ld
          which xenon-objcopy
          xenon-gcc --version
          
      - name: Debug - verificar libxenon
        run: |
          echo "=== Conteúdo de /usr/local/xenon/usr/lib/ ==="
          ls -la /usr/local/xenon/usr/lib/ || echo "Pasta não encontrada!"
          echo "=== Verificando libxenon.a ==="
          file /usr/local/xenon/usr/lib/libxenon.a || echo "Arquivo libxenon.a não encontrado!"
          echo "=== Procurando libxenon em outros lugares ==="
          find /usr/local -name "libxenon*" 2>/dev/null

      # ELF2XEX: SynthXEX (FreeChainXenon) - ferramenta open-source encontrada
      # para esse propósito. IMPORTANTE: não foi validada contra ELFs gerados
      # pelo libxenon clássico (foi projetada para o toolchain próprio do
      # FreeChainXenon). Por isso esse passo tem "continue-on-error" e o
      # próximo passo imprime "--help" para conferirmos a sintaxe real antes
      # de confiar cegamente nela.
      - name: Construir SynthXEX (candidato a elf2xex) - experimental
        id: synthxex
        continue-on-error: true
        run: |
          git clone https://git.aidenisik.scot/FreeChainXenon/SynthXEX.git synthxex-src
          cd synthxex-src
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make
          sudo make install

      - name: Mostrar uso real do SynthXEX (para conferência)
        if: steps.synthxex.outcome == 'success'
        run: synthxex --help || synthxex -h || true

      - name: Compilar o ELF do XboxCDTest
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          make clean
          make elf

      - name: Verificar o ELF gerado
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          file build/xboxcdtest.elf
          xenon-objdump -h build/xboxcdtest.elf || true
          xenon-nm build/xboxcdtest.elf | head -40 || true

      # Tentativa de conversão ELF -> XEX. Se a sintaxe impressa no passo
      # acima for diferente de "synthxex -o saida.xex entrada.elf", ajuste
      # esta linha antes de confiar no resultado.
      - name: Converter ELF -> XEX (SynthXEX) - experimental
        if: steps.synthxex.outcome == 'success'
        continue-on-error: true
        run: |
          synthxex -o build/xboxcdtest.xex build/xboxcdtest.elf || \
          synthxex build/xboxcdtest.elf build/xboxcdtest.xex || true
          file build/xboxcdtest.xex || true

      - name: Publicar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: xboxcdtest-build
          path: |
            build/xboxcdtest.elf
            build/xboxcdtest.xex
            libxenon/toolchain/build.log
          if-no-files-found: warn
