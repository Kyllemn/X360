name: Build XboxCDTest XEX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Instalar dependências de build do host
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison gcc-multilib libgmp3-dev libmpfr-dev \
            libmpc-dev texinfo git-core build-essential wget file pv cmake \
            libgmp-dev nettle-dev

      - name: Cache do toolchain Xenon
        id: cache-xenon
        uses: actions/cache@v4
        with:
          path: /usr/local/xenon
          key: xenon-toolchain-${{ runner.os }}-v11
          restore-keys: |
            xenon-toolchain-${{ runner.os }}-

      - name: Clonar libxenon (Free60Project)
        run: git clone --depth 1 https://github.com/Free60Project/libxenon.git

      - name: Construir toolchain Xenon (binutils + gcc + newlib)
        if: steps.cache-xenon.outputs.cache-hit != 'true'
        working-directory: libxenon/toolchain
        run: |
          export PREFIX=/usr/local/xenon
          ./build-xenon-toolchain toolchain

      # =============================================
      # SOLUÇÃO 1: Criar diretório lib manualmente (ATIVA - CORRIGIDA)
      # =============================================
      - name: Construir libxenon (criando lib manualmente - CORRIGIDO)
        working-directory: libxenon
        run: |
          export PREFIX=/usr/local/xenon
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          export CC=xenon-gcc
          export CXX=xenon-g++
          export AR=xenon-ar
          export RANLIB=xenon-ranlib
          export CFLAGS="-m32 -mcpu=cell -mtune=cell"
          export CXXFLAGS="-m32 -mcpu=cell -mtune=cell"
          export LDFLAGS="-m32"
          
          echo "=== Procurando Makefile.xenon ==="
          find . -name "Makefile.xenon" -type f
          
          echo "=== Copiando Makefile.xenon para lib/ ==="
          # Tenta encontrar em qualquer lugar
          MAKEFILE=$(find . -name "Makefile.xenon" -type f | head -1)
          if [ -z "$MAKEFILE" ]; then
            echo "ERRO: Makefile.xenon não encontrado!"
            exit 1
          fi
          
          echo "Encontrado: $MAKEFILE"
          mkdir -p lib
          cp "$MAKEFILE" lib/Makefile.xenon
          
          echo "=== Compilando libxenon com Makefile ==="
          cd lib
          make -f Makefile.xenon clean || true
          make -f Makefile.xenon
          sudo make -f Makefile.xenon install
          cd ..
          
          echo "=== Verificando libxenon ==="
          file /usr/local/xenon/usr/lib/libxenon.a
          xenon-objdump -f /usr/local/xenon/usr/lib/libxenon.a | head -5

      # =============================================
      # SOLUÇÃO 2: Usar script original com flags (COMENTADA)
      # =============================================
      # - name: Construir libxenon (via script original com flags)
      #   working-directory: libxenon/toolchain
      #   run: |
      #     export PREFIX=/usr/local/xenon
      #     export DEVKITXENON=/usr/local/xenon
      #     export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
      #     export CFLAGS="-m32 -mcpu=cell -mtune=cell"
      #     export CXXFLAGS="-m32 -mcpu=cell -mtune=cell"
      #     export LDFLAGS="-m32"
      #     
      #     echo "=== Compilando libxenon com script original ==="
      #     rm -rf ../lib
      #     ./build-xenon-toolchain libxenon
      #     
      #     echo "=== Verificando libxenon ==="
      #     file /usr/local/xenon/usr/lib/libxenon.a
      #     xenon-objdump -f /usr/local/xenon/usr/lib/libxenon.a | head -5

      # =============================================
      # SOLUÇÃO 3: Compilar com Makefile diretamente (COMENTADA)
      # =============================================
      # - name: Construir libxenon (Makefile direto - com find)
      #   working-directory: libxenon
      #   run: |
      #     export PREFIX=/usr/local/xenon
      #     export DEVKITXENON=/usr/local/xenon
      #     export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
      #     export CC=xenon-gcc
      #     export CXX=xenon-g++
      #     export AR=xenon-ar
      #     export RANLIB=xenon-ranlib
      #     export CFLAGS="-m32 -mcpu=cell -mtune=cell"
      #     export CXXFLAGS="-m32 -mcpu=cell -mtune=cell"
      #     export LDFLAGS="-m32"
      #     
      #     echo "=== Procurando Makefile.xenon ==="
      #     MAKEFILE=$(find . -name "Makefile.xenon" -type f | head -1)
      #     echo "Usando: $MAKEFILE"
      #     
      #     echo "=== Compilando libxenon com Makefile ==="
      #     DIR=$(dirname "$MAKEFILE")
      #     cd "$DIR"
      #     make -f Makefile.xenon clean || true
      #     make -f Makefile.xenon
      #     sudo make -f Makefile.xenon install
      #     cd -
      #     
      #     echo "=== Verificando libxenon ==="
      #     file /usr/local/xenon/usr/lib/libxenon.a
      #     xenon-objdump -f /usr/local/xenon/usr/lib/libxenon.a | head -5

      - name: Verificar toolchain
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          which xenon-gcc
          which xenon-g++
          which xenon-ld
          which xenon-objcopy
          xenon-gcc --version

      - name: Compilar o ELF do XboxCDTest
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          make clean
          make elf

      - name: Verificar o ELF gerado
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
          file build/xboxcdtest.elf
          xenon-objdump -h build/xboxcdtest.elf || true

      - name: Publicar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: xboxcdtest-build
          path: |
            build/xboxcdtest.elf
            libxenon/toolchain/build.log
          if-no-files-found: warn
